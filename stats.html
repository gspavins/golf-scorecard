<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Head-to-head — Gav &amp; Phil</title>
<link rel="icon" type="image/png" href="golf-icon.png">
<link rel="apple-touch-icon" href="golf-icon.png">
<meta name="theme-color" content="#293234">
<style>
  :root{--ink:#293234;--card:#f4f7f4;--line:#c3ccc3;--hair:#d3ddd3;--gun:#293234;--gun-dk:#1e2627;--pastel:#c5dac5;--pastel-soft:#dceadc;--pastel-deep:#7fa87f;--dim:#6f7a76;--gav:#293234;--phil:#7fa87f}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#dfe6df;color:var(--ink);min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{background:var(--gun);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
  header .back{font:inherit;font-size:20px;font-weight:700;color:var(--pastel);text-decoration:none;line-height:1}
  header h1{font-family:Georgia,serif;font-size:19px;flex:1}
  .body{padding:14px;overflow:auto}
  .card{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(41,50,52,.08)}
  .card h2{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
  /* head to head */
  .h2h{display:flex;align-items:stretch;text-align:center}
  .h2h .side{flex:1;padding:6px}
  .h2h .nm{font-family:Georgia,serif;font-size:17px;font-weight:700}
  .h2h .wins{font-size:44px;font-weight:800;line-height:1;margin:6px 0}
  .h2h .gav .wins{color:var(--gav)}.h2h .phil .wins{color:var(--phil)}
  .h2h .sub{font-size:11px;color:var(--dim)}
  .h2h .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 6px}
  .h2h .mid .v{font-size:11px;font-weight:800;color:var(--dim);letter-spacing:.1em}
  .h2h .mid .halved{font-size:12px;color:var(--dim);margin-top:6px}
  .streak{text-align:center;font-size:13px;color:var(--ink);margin-top:12px;padding-top:12px;border-top:1px solid var(--hair)}
  .streak b{color:var(--gun-dk)}
  .recent{display:flex;gap:5px;justify-content:center;margin-top:10px;flex-wrap:wrap}
  .recent .p{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
  .recent .p.g{background:var(--gav)}.recent .p.p{background:var(--phil)}.recent .p.h{background:#b9b6ab}
  /* chart */
  #chartWrap{position:relative;height:230px}
  .legend{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:12px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:5px}
  .toggle{display:flex;gap:6px;margin-bottom:12px}
  .toggle button{flex:1;font:inherit;font-weight:700;font-size:11px;padding:7px;border-radius:7px;border:1px solid var(--hair);background:#fff;color:var(--dim);cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
  .toggle button.on{background:var(--gun);color:var(--pastel);border-color:var(--gun)}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:#fff;border:1px solid var(--hair);border-radius:10px;padding:10px;text-align:center}
  .stat .n{font-size:22px;font-weight:800;color:var(--gun-dk)}
  .stat .l{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
  .empty{text-align:center;color:var(--dim);padding:40px 20px;font-size:14px}
  .loading{text-align:center;color:var(--dim);padding:40px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="index.html">&larr;</a>
    <h1>Gav v Phil</h1>
  </header>
  <div class="body" id="body"><div class="loading">Crunching the numbers…</div></div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const bodyEl=document.getElementById('body');
let GAMES=[]; // completed games: {id,date,course,gavGross,philGross,gavPts,philPts,winner}
let chart=null, chartMode='margin';

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function strokesOnHole(hc,si){let s=0;if(hc>=si)s++;if(hc>=si+18)s++;return s;}

async function fetchAll(sb,table,cols){
  const out=[];let from=0;const page=1000;
  for(let i=0;i<25;i++){
    const {data,error}=await sb.from(table).select(cols).range(from,from+page-1);
    if(error)throw error;
    if(!data||!data.length)break;
    out.push(...data);if(data.length<page)break;from+=page;
  }
  return out;
}

async function load(){
  if(typeof SUPABASE_URL==='undefined'||!SUPABASE_URL||!window.supabase){
    bodyEl.innerHTML='<div class="empty">Stats need Supabase — not configured.</div>';return;
  }
  try{
    const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    // course hole data (par + stroke index) for capping
    const holes=await fetchAll(sb,'course_holes','course_id,hole,par,stroke_index');
    const holesByCourse={};
    holes.forEach(h=>{(holesByCourse[h.course_id]||(holesByCourse[h.course_id]=[])).push(h);});
    // all score rows
    const rows=await fetchAll(sb,'scores','game_id,player,hole,strokes,course,hcap_gav,hcap_phil,game_date,final');
    // group by game
    const games={};
    rows.forEach(r=>{
      const g=games[r.game_id]||(games[r.game_id]={id:r.game_id,meta:null,gav:{},phil:{}});
      if(r.player==='__meta')g.meta=r;
      else if(r.player==='gav'&&r.strokes!=null)g.gav[r.hole]=r.strokes;
      else if(r.player==='phil'&&r.strokes!=null)g.phil[r.hole]=r.strokes;
    });
    // keep only FINAL games with scores from both players
    GAMES=[];
    Object.values(games).forEach(g=>{
      if(!g.meta||!g.meta.final)return;
      const gH=Object.keys(g.gav).length, pH=Object.keys(g.phil).length;
      if(gH===0||pH===0)return;
      const course=g.meta.course, ch=holesByCourse[course]||[];
      const parBy={},siBy={};
      ch.forEach(h=>{parBy[h.hole]=h.par;siBy[h.hole]=h.stroke_index;});
      const hcG=g.meta.hcap_gav||0, hcP=g.meta.hcap_phil||0;
      // gross with net-double-bogey cap, over holes BOTH played
      let gGross=0,pGross=0,gPts=0,pPts=0;
      for(let h=1;h<=18;h++){
        const a=g.gav[h],b=g.phil[h];
        const par=parBy[h], si=siBy[h];
        const capA=(par&&si)?par+strokesOnHole(hcG,si)+2:99;
        const capB=(par&&si)?par+strokesOnHole(hcP,si)+2:99;
        if(a!=null&&b!=null){gGross+=Math.min(a,capA);pGross+=Math.min(b,capB);}
        // stableford points (net) if we have par/si
        if(par&&si){
          if(a!=null){const net=a-strokesOnHole(hcG,si);const pt=Math.max(0,2+(par-net));gPts+=pt;}
          if(b!=null){const net=b-strokesOnHole(hcP,si);const pt=Math.max(0,2+(par-net));pPts+=pt;}
        }
      }
      let winner='halved';
      if(gGross<pGross)winner='gav';else if(pGross<gGross)winner='phil';
      GAMES.push({id:g.id,date:g.meta.game_date||'',course,gavGross:gGross,philGross:pGross,gavPts:gPts,philPts:pPts,winner});
    });
    GAMES.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    render();
  }catch(e){console.error(e);bodyEl.innerHTML='<div class="empty">Couldn’t load stats. '+esc(e.message||'')+'</div>';}
}

function render(){
  if(!GAMES.length){bodyEl.innerHTML='<div class="empty">No completed rounds yet. Mark a round as final to build your head-to-head record.</div>';return;}
  const gWins=GAMES.filter(g=>g.winner==='gav').length;
  const pWins=GAMES.filter(g=>g.winner==='phil').length;
  const halved=GAMES.filter(g=>g.winner==='halved').length;
  // current streak
  let streak=0,who=null;
  for(let i=GAMES.length-1;i>=0;i--){const w=GAMES[i].winner;if(w==='halved')break;if(who===null){who=w;streak=1;}else if(w===who)streak++;else break;}
  const streakTxt=who?`<b>${who==='gav'?'Gav':'Phil'}</b> has won the last <b>${streak}</b>`:'Last round was halved';
  // recent form (last 8)
  const recent=GAMES.slice(-8).map(g=>{
    const cls=g.winner==='gav'?'g':g.winner==='phil'?'p':'h';
    const lt=g.winner==='gav'?'G':g.winner==='phil'?'P':'½';
    return `<div class="p ${cls}">${lt}</div>`;
  }).join('');
  // averages
  const avg=(arr)=>arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length):0;
  const gAvg=avg(GAMES.map(g=>g.gavGross)), pAvg=avg(GAMES.map(g=>g.philGross));
  const gBest=Math.min(...GAMES.map(g=>g.gavGross)), pBest=Math.min(...GAMES.map(g=>g.philGross));

  bodyEl.innerHTML=`
    <div class="card">
      <h2>Head-to-head · ${GAMES.length} round${GAMES.length>1?'s':''}</h2>
      <div class="h2h">
        <div class="side gav"><div class="nm">Gav</div><div class="wins">${gWins}</div><div class="sub">wins</div></div>
        <div class="mid"><div class="v">VS</div>${halved?`<div class="halved">${halved} halved</div>`:''}</div>
        <div class="side phil"><div class="nm">Phil</div><div class="wins">${pWins}</div><div class="sub">wins</div></div>
      </div>
      <div class="recent">${recent}</div>
      <div class="streak">${streakTxt}</div>
    </div>

    <div class="card">
      <h2>Scoring trend</h2>
      <div class="toggle">
        <button data-m="margin" class="on">Margin</button>
        <button data-m="gross">Gross</button>
        <button data-m="points">Points</button>
      </div>
      <div id="chartWrap"><canvas id="chart"></canvas></div>
      <div class="legend"><span><i style="background:var(--gav)"></i>Gav</span><span><i style="background:var(--phil)"></i>Phil</span></div>
    </div>

    <div class="card">
      <h2>Form</h2>
      <div class="statgrid">
        <div class="stat"><div class="n">${gAvg}</div><div class="l">Gav avg gross</div></div>
        <div class="stat"><div class="n">${pAvg}</div><div class="l">Phil avg gross</div></div>
        <div class="stat"><div class="n">${gBest}</div><div class="l">Gav best</div></div>
        <div class="stat"><div class="n">${pBest}</div><div class="l">Phil best</div></div>
      </div>
    </div>`;

  bodyEl.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{
    bodyEl.querySelectorAll('.toggle button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');chartMode=b.dataset.m;drawChart();
  });
  drawChart();
}

function drawChart(){
  const ctx=document.getElementById('chart');if(!ctx)return;
  if(chart)chart.destroy();
  const labels=GAMES.map((g,i)=>g.date?g.date.slice(5):('R'+(i+1)));
  let datasets, opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:9}}},y:{ticks:{font:{size:10}}}}};
  if(chartMode==='gross'){
    datasets=[
      {label:'Gav',data:GAMES.map(g=>g.gavGross),borderColor:'#293234',backgroundColor:'#293234',tension:.3},
      {label:'Phil',data:GAMES.map(g=>g.philGross),borderColor:'#7fa87f',backgroundColor:'#7fa87f',tension:.3}
    ];
  }else if(chartMode==='points'){
    datasets=[
      {label:'Gav',data:GAMES.map(g=>g.gavPts),borderColor:'#293234',backgroundColor:'#293234',tension:.3},
      {label:'Phil',data:GAMES.map(g=>g.philPts),borderColor:'#7fa87f',backgroundColor:'#7fa87f',tension:.3}
    ];
  }else{ // margin: phil gross - gav gross (positive = Gav better/ahead)
    const marg=GAMES.map(g=>g.philGross-g.gavGross);
    datasets=[{label:'Margin',data:marg,borderColor:'#7fa87f',backgroundColor:marg.map(v=>v>=0?'#293234':'#c98a3c'),
      pointBackgroundColor:marg.map(v=>v>=0?'#293234':'#c98a3c'),tension:.3,fill:{target:'origin',above:'rgba(41,50,52,.08)',below:'rgba(201,138,60,.12)'}}];
    opts.plugins.tooltip={callbacks:{label:c=>{const v=c.raw;return v>0?`Gav by ${v}`:v<0?`Phil by ${-v}`:'Halved';}}};
  }
  chart=new Chart(ctx,{type:'line',data:{labels,datasets},options:opts});
}
load();
</script>
</body>
</html>
