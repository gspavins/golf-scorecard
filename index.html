<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gav &amp; Phil — Golf</title>
<link rel="icon" type="image/png" href="golf-icon.png">
<link rel="apple-touch-icon" href="golf-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Golf">
<meta name="theme-color" content="#0f5c34">
<style>
  :root{--ink:#1e1e1e;--card:#fff;--line:#3a3a3a;--hair:#b9b6ab;--green:#0f5c34;--green-dk:#0a3f24;--gold:#b8912f;--dim:#6d6a60}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:radial-gradient(120% 90% at 50% 0%,#eceae1,#cfccc0);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--card);border:2px solid var(--line);border-radius:16px;max-width:400px;width:100%;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.15)}
  .hero{background:linear-gradient(180deg,var(--green-dk),var(--green));padding:26px 20px 22px;text-align:center;color:#fff}
  .hero img{width:82px;height:82px;border-radius:18px;box-shadow:0 2px 8px rgba(0,0,0,.35);margin-bottom:12px}
  .hero h1{font-family:Georgia,serif;font-size:24px;letter-spacing:.01em}
  .hero .sub{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:5px}
  .menu{padding:18px}
  .item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;text-decoration:none;color:var(--ink);background:#f6f4ec;border:1px solid var(--hair);border-radius:11px;padding:16px;margin-bottom:12px;cursor:pointer;font:inherit;transition:background .12s}
  .item:last-child{margin-bottom:0}
  .item:hover{background:#eee9dc}
  .item:active{transform:translateY(1px)}
  .item .ic{flex:0 0 auto;width:44px;height:44px;border-radius:11px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
  .item .ic.gold{background:var(--gold)}
  .item .tx{flex:1;min-width:0}
  .item .tt{font-weight:800;font-size:16px;color:var(--green-dk)}
  .item .ds{font-size:12px;color:var(--dim);margin-top:2px}
  .item .ar{color:var(--dim);font-size:20px}
  .item[hidden]{display:none}
  .foot{text-align:center;font-size:10px;color:var(--dim);padding:0 18px 16px}
</style>
</head>
<body>
  <div class="card">
    <div class="hero">
      <img src="golf-icon.png" alt="Golf">
      <h1>Gav &amp; Phil</h1>
      <div class="sub">Golf</div>
    </div>
    <div class="menu">
      <a class="item" id="resumeItem" href="scorecard.html" hidden>
        <span class="ic">&#9654;</span>
        <span class="tx"><span class="tt">Resume round</span><span class="ds" id="resumeDesc">Continue where you left off</span></span>
        <span class="ar">&rsaquo;</span>
      </a>
      <a class="item" href="scorecard.html?new=1">
        <span class="ic">&#9971;</span>
        <span class="tx"><span class="tt">New scorecard</span></span>
        <span class="ar">&rsaquo;</span>
      </a>
      <a class="item" href="scorecard.html?games=1">
        <span class="ic" style="background:#6d6a60">&#8803;</span>
        <span class="tx"><span class="tt">Past rounds</span></span>
        <span class="ar">&rsaquo;</span>
      </a>
      <a class="item" href="spend.html">
        <span class="ic gold">R</span>
        <span class="tx"><span class="tt">Spend tracker</span></span>
        <span class="ar">&rsaquo;</span>
      </a>
    </div>
    <div class="foot">v<span id="ver"></span></div>
  </div>
<script src="config.js"></script>
<script>
  document.getElementById('ver').textContent=(typeof APP_VERSION!=='undefined')?APP_VERSION:'';
  try{
    const last=localStorage.getItem('lastGame');
    if(last){
      const raw=localStorage.getItem('sc:'+last);
      if(raw){
        const d=JSON.parse(raw);
        const played=new Set([...Object.keys(d.scores?.gav||{}),...Object.keys(d.scores?.phil||{})]).size;
        if(played>0 && !d.gameFinal){
          const item=document.getElementById('resumeItem');
          item.hidden=false;
          item.href='scorecard.html?game='+encodeURIComponent(last);
          const cn={kloof:'Kloof',durban:'Durban CC',rjhb:"Royal Jo'burg",mowbray:'Mowbray',zimbali:'Zimbali',selborne:'Selborne',victoria:'Victoria CC',cotswold:'Cotswold Downs'}[d.courseKey]||'Round';
          document.getElementById('resumeDesc').textContent=cn+' · '+played+'/18 holes';
        }
      }
    }
  }catch(e){}
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
</body>
</html>
