<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Courses — Gav &amp; Phil</title>
<link rel="icon" type="image/png" href="golf-icon.png">
<link rel="apple-touch-icon" href="golf-icon.png">
<meta name="theme-color" content="#293234">
<style>
  :root{--ink:#293234;--card:#f4f7f4;--line:#c3ccc3;--hair:#d3ddd3;--gun:#293234;--gun-dk:#1e2627;--pastel:#c5dac5;--pastel-soft:#dceadc;--pastel-deep:#7fa87f;--dim:#6f7a76}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#dfe6df;color:var(--ink);min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{background:var(--gun);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
  header .back{font:inherit;font-size:20px;font-weight:700;color:var(--pastel);text-decoration:none;line-height:1}
  header h1{font-family:Georgia,serif;font-size:19px;flex:1}
  header .count{font-size:11px;color:var(--pastel);font-weight:700}
  .searchbar{padding:10px 14px;background:var(--card);border-bottom:1px solid var(--hair);position:sticky;top:44px;z-index:4}
  .searchbar input{width:100%;font:inherit;font-size:15px;border:1px solid var(--hair);border-radius:8px;padding:9px 11px;background:#fff;color:var(--ink)}
  .list{flex:1;overflow:auto;padding:8px 10px 24px}
  .crow{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:11px 12px;margin-bottom:8px}
  .crow .nm{font-weight:800;font-size:15px;color:var(--gun-dk);line-height:1.15}
  .crow .meta{font-size:11px;color:var(--dim);margin-top:2px}
  .crow .acts{display:flex;gap:7px;margin-top:9px}
  .crow .acts a{flex:1;text-align:center;text-decoration:none;font-size:12px;font-weight:700;padding:8px;border-radius:7px;letter-spacing:.02em}
  .crow .view{background:var(--pastel-soft);color:var(--gun-dk);border:1px solid var(--hair)}
  .crow .new{background:var(--gun);color:var(--pastel)}
  .empty{text-align:center;color:var(--dim);padding:40px 20px;font-size:14px}
  .loading{text-align:center;color:var(--dim);padding:40px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="index.html">&larr;</a>
    <h1>Courses</h1>
    <span class="count" id="count"></span>
  </header>
  <div class="searchbar">
    <input id="search" type="text" placeholder="Search courses…" autocomplete="off">
  </div>
  <div class="list" id="list"><div class="loading">Loading courses…</div></div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let COURSES=[];  // {id,name,location,tee,par}
const listEl=document.getElementById('list');
const countEl=document.getElementById('count');
const searchEl=document.getElementById('search');

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function render(){
  const q=searchEl.value.trim().toLowerCase();
  const rows=COURSES.filter(c=>!q||c.name.toLowerCase().includes(q));
  countEl.textContent=rows.length+' / '+COURSES.length;
  if(!rows.length){listEl.innerHTML='<div class="empty">No courses match “'+esc(searchEl.value)+'”.</div>';return;}
  listEl.innerHTML=rows.map(c=>{
    const bits=[c.tee?esc(c.tee)+' tees':'','Par '+c.par].filter(Boolean).join(' · ');
    return `<div class="crow">
      <div class="nm">${esc(c.name)}</div>
      <div class="meta">${bits}</div>
      <div class="acts">
        <a class="view" href="scorecard.html?course=${encodeURIComponent(c.id)}&view=1">View scorecard</a>
        <a class="new" href="scorecard.html?new=1&course=${encodeURIComponent(c.id)}">New scorecard</a>
      </div>
    </div>`;
  }).join('');
}

async function load(){
  if(typeof SUPABASE_URL==='undefined'||!SUPABASE_URL||!window.supabase){
    listEl.innerHTML='<div class="empty">Course list needs Supabase — not configured.</div>';return;
  }
  try{
    const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    const {data,error}=await sb.from('courses').select('id,name,location,tee,par').order('name',{ascending:true}).limit(2000);
    if(error)throw error;
    COURSES=(data||[]).map(c=>({id:c.id,name:c.name,location:c.location||'',tee:c.tee||'',par:c.par}));
    if(!COURSES.length){listEl.innerHTML='<div class="empty">No courses in the database yet. Run courses.sql in Supabase.</div>';return;}
    render();
  }catch(e){console.error(e);listEl.innerHTML='<div class="empty">Couldn’t load courses. '+esc(e.message||'')+'</div>';}
}
searchEl.addEventListener('input',render);
load();
</script>
</body>
</html>
